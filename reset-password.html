<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiteWatch — Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="radar"><div class="radar-sweep"></div></div>
  <div class="auth-card">
    <div class="brand-row">
      <div class="brand-mark">◎</div>
      <div class="brand-name">Site<span>Watch</span></div>
    </div>
    <h1>Set a new password</h1>
    <p class="sub">This link is single-use and expires 15 minutes after it's requested.</p>

    <div class="form-msg" id="msg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">New password</label>
        <div class="input-wrap"><input type="password" id="newPassword" placeholder="At least 6 characters" required></div>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="input-wrap"><input type="password" id="confirmPassword" placeholder="Repeat password" required></div>
      </div>
      <button type="submit" class="btn-primary">Update password</button>
    </form>
    <p class="foot-note"><a href="/login.html">Back to sign in</a></p>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const email = params.get('email');
const msg = document.getElementById('msg');

function showMsg(text, kind) {
  msg.textContent = text;
  msg.className = 'form-msg show ' + kind;
}

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('newPassword').value;
  const p2 = document.getElementById('confirmPassword').value;
  if (!token || !email) return showMsg('This reset link is missing its token — request a new one from the login page.', 'error');
  if (p1.length < 6) return showMsg('Password must be at least 6 characters.', 'error');
  if (p1 !== p2) return showMsg('Passwords do not match.', 'error');

  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, token, newPassword: p1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not reset password.');
    showMsg('Password updated. Redirecting to sign in…', 'success');
    setTimeout(() => (location.href = '/login.html'), 1400);
  } catch (err) {
    showMsg(err.message, 'error');
  }
});
</script>
</body>
</html>
